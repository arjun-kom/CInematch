server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the FastAPI container.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # React Router: unknown paths load index.html.
  location / {
    try_files $uri /index.html;
  }
}
